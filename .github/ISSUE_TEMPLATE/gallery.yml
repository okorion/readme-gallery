name: Leave a gallery object
description: Choose a shape and a color for this README exhibition.
title: "[Gallery] A new object"
body:
  - type: markdown
    attributes:
      value: "Choose an object for the public gallery. Your latest open entry is used; close it to remove it on the next refresh. / 도형과 색상을 선택하세요. 최신 열린 항목이 전시되며, 닫으면 다음 갱신 때 제외됩니다."
  - type: dropdown
    id: shape
    attributes:
      label: Shape
      options: [Sphere, Cube, Ring, Arch, Pyramid]
    validations:
      required: true
  - type: dropdown
    id: color
    attributes:
      label: Color
      options: [Blue, Mint, Violet, White]
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Public display
      options:
        - label: I agree that my selected shape and color will appear in this public README.
          required: true
